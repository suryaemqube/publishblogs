<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="nav-brand">
      <img src="assets/emqube-logo-white.svg" alt="emQube">
    </div>

    <div class="nav-sec">Workspace</div>
    <a routerLink="/documents" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.8H4.2A1.2 1.2 0 0 0 3 3v10a1.2 1.2 0 0 0 1.2 1.2h7.6A1.2 1.2 0 0 0 13 13V5.8z"/><path d="M9 1.8V5.8h4"/></svg><span>Documents</span></a>
    <a routerLink="/articles" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6 14.4 5 8 8.4 1.6 5z"/><path d="M1.6 8 8 11.4 14.4 8"/><path d="M1.6 11 8 14.4 14.4 11"/></svg><span>Articles</span></a>

    <div class="nav-sec">Clients</div>
    <a routerLink="/sites" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.1"/><path d="M1.9 8h12.2"/><path d="M8 1.9c1.9 2.2 1.9 9 0 12.2M8 1.9c-1.9 2.2-1.9 9 0 12.2"/></svg><span>Sites</span></a>

    @if (canManageUsers) {
      <div class="nav-sec">Settings</div>
      <a routerLink="/settings/team" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 14v-1.4a2.8 2.8 0 0 0-2.8-2.8H4.4a2.8 2.8 0 0 0-2.8 2.8V14"/><circle cx="6.2" cy="5.2" r="2.4"/></svg><span>Team</span></a>
    }

  </nav>

  <div>
    <header class="topbar">
      <div class="row-tight" style="margin-left:auto">
        <span class="avatar" [title]="auth.user()?.displayName ?? ''">{{ initials }}</span>
        <button class="btn btn-ghost btn-sm" type="button" title="Sign out" (click)="signOut()">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 14H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h5.2"/><path d="M11.4 8H6"/><path d="M9 5.2 11.8 8 9 10.8"/></svg>
          Sign out
        </button>
      </div>
    </header>

    <main>
      <router-outlet />
    </main>
  </div>
</div>
