<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="nav-brand">
      <img src="assets/emqube-logo-white.svg" alt="emQube">
    </div>

    <div class="nav-sec">Workspace</div>
    <a routerLink="/documents" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.8H4.2A1.2 1.2 0 0 0 3 3v10a1.2 1.2 0 0 0 1.2 1.2h7.6A1.2 1.2 0 0 0 13 13V5.8z"/><path d="M9 1.8V5.8h4"/></svg><span>Documents</span></a>
    <span class="nav-off" title="Not built yet"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6 14.4 5 8 8.4 1.6 5z"/><path d="M1.6 8 8 11.4 14.4 8"/><path d="M1.6 11 8 14.4 14.4 11"/></svg><span>Articles</span></span>

    <div class="nav-sec">Publishing</div>
    <span class="nav-off" title="Not built yet"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.6 13.4 3.6V8c0 3-2.3 5.5-5.4 6.4C4.9 13.5 2.6 11 2.6 8V3.6z"/><path d="M5.8 7.9 7.4 9.5l3-3.2"/></svg><span>Review queue</span></span>
    <span class="nav-off" title="Not built yet"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 1.6 1.6 6.8l5 1.9 1.9 5z"/><path d="M14.4 1.6 6.6 8.7"/></svg><span>Publications</span></span>
    <span class="nav-off" title="Not built yet"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.9 15 13.4H1z"/><path d="M8 6.2v3.4"/><circle cx="8" cy="11.5" r=".7" fill="currentColor" stroke="none"/></svg><span>Failures</span></span>

    <div class="nav-sec">Clients</div>
    <a routerLink="/sites" routerLinkActive="on"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.1"/><path d="M1.9 8h12.2"/><path d="M8 1.9c1.9 2.2 1.9 9 0 12.2M8 1.9c-1.9 2.2-1.9 9 0 12.2"/></svg><span>Sites</span></a>

    <div class="nav-sec">Settings</div>
    <span class="nav-off" title="Not built yet"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 14v-1.4a2.8 2.8 0 0 0-2.8-2.8H4.4a2.8 2.8 0 0 0-2.8 2.8V14"/><circle cx="6.2" cy="5.2" r="2.4"/></svg><span>Team</span></span>

    <div class="nav-foot">Local build<br>Brand: emqube.com</div>
  </nav>

  <div>
    <header class="topbar">
      <div class="search" title="Search is not built yet">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
        <input type="search" placeholder="Search articles, sites, deployments&hellip;" aria-label="Search" disabled>
      </div>
      <div class="row-tight" style="margin-left:auto">
        <span class="avatar" [title]="auth.user()?.displayName ?? ''">{{ initials }}</span>
        <button class="btn btn-ghost btn-sm" type="button" title="Sign out" (click)="signOut()">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 14H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h5.2"/><path d="M11.4 8H6"/><path d="M9 5.2 11.8 8 9 10.8"/></svg>
          Sign out
        </button>
      </div>
    </header>

    <div class="ctxbar">
      <label>Client</label>
      <span class="ctx"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5.4" r="2.9"/><path d="M2.8 14a5.2 5.2 0 0 1 10.4 0"/></svg> emQube</span>
      <span class="muted xs" style="margin-left:auto">Client and site stay selected until you change them</span>
    </div>

    <main>
      <router-outlet />
    </main>
  </div>
</div>
