<div class="auth">
  <div class="auth-card">
    <div class="auth-form">
      <img class="auth-logo" src="assets/emqube-logo-black.svg" alt="emQube Content Publisher">
      <h1>Sign in to emQube Content Publisher</h1>

      @if (expired) {
        <div class="alert alert-info" style="margin-bottom:16px"><p style="margin:0">Your session has ended. Sign in again.</p></div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Your email</label>
          <input class="input" type="email" id="email" formControlName="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input class="input" type="password" id="pw" formControlName="password" autocomplete="current-password">
        </div>

        @if (error(); as err) {
          <div class="alert alert-danger" role="alert" style="margin-bottom:16px"><p style="margin:0">{{ err }}</p></div>
        }

        <button class="btn btn-primary btn-lg" type="submit" style="width:100%" [disabled]="form.invalid || busy()">
          {{ busy() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
