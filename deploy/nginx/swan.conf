# Swan Content Publisher — Nginx reverse proxy.
# Place at /etc/nginx/sites-available/swan.conf and enable:
#   sudo ln -s /etc/nginx/sites-available/swan.conf /etc/nginx/sites-enabled/swan.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue a TLS certificate:
#   sudo certbot --nginx -d publishblogs.emqube.net
# Certbot rewrites this file to add the HTTPS server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name publishblogs.emqube.net;

    # Word .docx uploads and images. The app caps individual files, but the proxy must allow the body.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5197;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection tests and document conversion can take a while; don't cut them at 60s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
